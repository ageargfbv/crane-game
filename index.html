<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>クレーンゲーム</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<style>
:root{--bg:#f2f2f4;--fg:#2d3748;--panel:#fff;--acc:#e53e3e;--org:#f6a01a;--mute:#8a909c;--line:#e2e4e8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column}
header{background:var(--panel);padding:calc(env(safe-area-inset-top) + 6px) 12px 6px;display:grid;
  grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:1px solid var(--line)}
header .l{font-size:14px;color:var(--mute)} header .l b{color:var(--acc);font-size:17px;margin:0 6px 0 2px}
header h1{margin:0;font-size:17px;font-weight:700}
header .r{justify-self:end}
.icon{border:0;background:#edf0f4;color:var(--fg);border-radius:999px;height:34px;min-width:44px;padding:0 12px;font-size:16px}
#stage{position:relative;flex:1;min-height:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
#cam{position:absolute;right:0;top:0;width:76px;height:76px;border:0;border-radius:0 0 0 76px;
  background:rgba(40,44,52,.82);color:#fff;font-size:15px;font-weight:700;padding:0 0 12px 18px}
#msg{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);font-size:56px;font-weight:900;
  color:#fff;-webkit-text-stroke:2px var(--acc);text-shadow:0 4px 16px rgba(0,0,0,.35);opacity:0;transition:all .25s;pointer-events:none}
#msg.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.pad{background:#e9eaee;padding:14px 16px calc(env(safe-area-inset-bottom) + 18px);display:flex;
  justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line)}
.btn{border:0;border-radius:50%;color:#fff;font-weight:800;touch-action:none;transition:transform .05s,box-shadow .05s,opacity .15s}
.arrow{width:84px;height:84px;font-size:40px;background:radial-gradient(circle at 50% 35%,#ffc94a,var(--org));box-shadow:0 6px 0 #b8670f}
.catch{width:112px;height:112px;font-size:24px;background:radial-gradient(circle at 50% 35%,#ff7a7a,var(--acc));box-shadow:0 7px 0 #8f1f1f}
.btn.on{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn:disabled{opacity:.35}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:72%;overflow-y:auto;background:var(--panel);z-index:5;
  border-radius:16px 16px 0 0;padding:6px 16px calc(env(safe-area-inset-bottom) + 16px);transform:translateY(105%);
  transition:transform .25s;box-shadow:0 -8px 24px rgba(0,0,0,.15)}
#sheet.open{transform:none}
#sheet h3{margin:14px 0 2px;font-size:13px;color:var(--mute);font-weight:600}
.row{display:grid;grid-template-columns:7em 1fr 4.6em;align-items:center;gap:8px;min-height:40px}
.row label{font-size:15px}
.row output{font-size:14px;text-align:right;color:var(--acc);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;font-size:16px;accent-color:var(--acc)}
select{font-size:16px;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;color:var(--fg)}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acts button{flex:1;min-width:7em;height:44px;border-radius:10px;border:0;font-size:16px;background:#edf0f4;color:var(--fg)}
.acts button.pri{background:var(--acc);color:#fff;font-weight:700}
#load{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute)}
</style>
</head>
<body>
<header>
  <div class="l">残り<b id="left">10</b>獲得<b id="got">0</b></div>
  <h1>橋わたし</h1>
  <div class="r"><button class="icon" id="home">初期位置</button> <button class="icon" id="gear">⚙</button></div>
</header>
<div id="stage">
  <div id="load">…</div>
  <button id="cam">まえ</button>
  <div id="msg">GET!</div>
</div>
<div class="pad">
  <button class="btn arrow" id="bl">←</button>
  <button class="btn catch" id="bc">キャッチ</button>
  <button class="btn arrow" id="br">→</button>
</div>
<div id="sheet">
  <h3>アーム</h3>
  <div class="row"><label for="p_grip">つかむ力</label><input type="range" id="p_grip" min="0.05" max="3" step="0.05"><output></output></div>
  <div class="row"><label for="p_topkeep">上での力</label><input type="range" id="p_topkeep" min="0" max="1" step="0.05"><output></output></div>
  <div class="row"><label for="p_open">爪の開き</label><input type="range" id="p_open" min="5" max="45" step="1"><output></output></div>
  <div class="row"><label for="p_push">押し込み</label><input type="range" id="p_push" min="0" max="30" step="1"><output></output></div>
  <div class="row"><label for="p_speed">移動の速さ</label><input type="range" id="p_speed" min="0.03" max="0.15" step="0.005"><output></output></div>
  <h3>箱</h3>
  <div class="row"><label for="p_bw">横</label><input type="range" id="p_bw" min="60" max="220" step="5"><output></output></div>
  <div class="row"><label for="p_bd">奥行き</label><input type="range" id="p_bd" min="100" max="300" step="5"><output></output></div>
  <div class="row"><label for="p_bh">高さ</label><input type="range" id="p_bh" min="30" max="200" step="5"><output></output></div>
  <div class="row"><label for="p_bm">重さ</label><input type="range" id="p_bm" min="50" max="1500" step="25"><output></output></div>
  <div class="row"><label for="p_bf">箱のすべり</label><input type="range" id="p_bf" min="0.05" max="1" step="0.05"><output></output></div>
  <div class="row"><label for="p_place">置き方</label>
    <select id="p_place"><option value="0">まっすぐ</option><option value="1">少しずらす</option><option value="2">斜め</option></select><output></output></div>
  <h3>バー</h3>
  <div class="row"><label for="p_gap">間隔</label><input type="range" id="p_gap" min="60" max="260" step="5"><output></output></div>
  <div class="row"><label for="p_br">太さ</label><input type="range" id="p_br" min="6" max="25" step="1"><output></output></div>
  <div class="row"><label for="p_bfr">バーのすべり</label><input type="range" id="p_bfr" min="0.05" max="1.2" step="0.05"><output></output></div>
  <div class="row"><label for="p_gfront">手前のバー</label><input type="range" id="p_gfront" min="30" max="150" step="5"><output></output></div>
  <div class="row"><label for="p_gback">奥の枠</label><input type="range" id="p_gback" min="10" max="120" step="5"><output></output></div>
  <div class="acts">
    <button id="reset" class="pri">台を戻す</button>
    <button id="plus">＋10回</button>
    <button id="defaults">初期値</button>
    <button id="close">閉じる</button>
  </div>
</div>
<script type="module">
import * as THREE from "./lib/three.module.min.js";
import RAPIER from "./lib/rapier.es.js";

// ---------------------------------------------------------------- 設定（長さ mm・重さ g で持つ）
const KEY = "crane-game-v4";
const DEF = { grip: 0.2, topkeep: 0.3, open: 24, push: 10, speed: 0.08,
  bw: 120, bd: 160, bh: 170, bm: 400, bf: 0.45, place: 1, gap: 125, br: 14, bfr: 0.9, gfront: 40, gback: 35 };
const FMT = { grip: v => "×" + (+v).toFixed(2), topkeep: v => Math.round(v * 100) + "%", open: v => v + "°",
  push: v => v + "mm", speed: v => Math.round(v * 1000) + "mm/s", bw: v => v + "mm", bd: v => v + "mm",
  bh: v => v + "mm", bm: v => v + "g", bf: v => (+v).toFixed(2), place: () => "", gap: v => v + "mm",
  br: v => v + "mm", bfr: v => (+v).toFixed(2), gfront: v => v + "mm", gback: v => v + "mm" };
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { store = {}; }
const P = Object.assign({}, DEF, store.p || {});
let credits = store.left ?? 10, got = store.got ?? 0;
function persist() { try { localStorage.setItem(KEY, JSON.stringify({ p: P, left: credits, got })); } catch (e) {} }

// ---------------------------------------------------------------- 寸法（m）
const BAR_Y = 0.30, BAR_LEN = 0.56;
const HOME = { x: -0.23, z: 0.25 };   // 手前のバーより前＝取り出し口の上
const LIM = { x: [-0.23, 0.23], z: [-0.20, 0.25] };
const TOP_Y = 0.80;                  // 高さ200mmの箱の上を爪先が通れる高さ
// アーム（本人の写真: あそVIVA 阪急茨木店）: 頭の下の角から外へ下がって肘、そこから長く内へ下がる「く」の字の透明の板。
// 閉じると黒いゴムの爪先が真ん中で合い V 字になる。座標は頭の中心から（m）。
const HINGE = 0.07, HINGE_Y = -0.05;
const ELBOW = [0.13, -0.06], TIP = [0.014, -0.175];   // 付け根からの肘と爪先（左右は s を掛ける）
const ARM_D = 0.05, ARM_T = 0.012;                    // 板の奥行きと厚み
const REACH = -HINGE_Y - TIP[1];                      // 頭の中心から爪先までの高さ
const TIP_SLOPE = 0.5;                                // 爪先の反り。重みが爪を開く向きにかかる
const DOWN_V = 0.09, UP_V = 0.08, BACK_V = 0.12;

// ---------------------------------------------------------------- 描画
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe3ea);
const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 10);
// まえ: ←→ が左右（x）／ よこ: 左から見て ←→ が奥と手前（z）
const VIEWS = [
  { name: "まえ", pos: [0, 0.74, 0.86], at: [0, 0.40, -0.02], axis: "x", sign: 1 },
  { name: "よこ", pos: [-0.88, 0.72, 0.02], at: [0, 0.40, 0], axis: "z", sign: 1 },
];
let viewIdx = 0;
const nets = [], nearSide = [];
function setView(i) {
  viewIdx = i; const v = VIEWS[i];
  for (const m of [nets[0], ...nearSide]) if (m) m.visible = v.axis !== "z";   // よこ から見るときは手前の網と枠を消す
  camera.position.set(...v.pos); camera.lookAt(...v.at);
  document.getElementById("cam").textContent = v.name;
}
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w < h ? 58 : 42; camera.updateProjectionMatrix();
}
addEventListener("resize", resize);

scene.add(new THREE.HemisphereLight(0xffffff, 0x8890a0, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(0.3, 1.4, 0.7); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -0.5, right: 0.5, top: 0.5, bottom: -0.5, near: 0.1, far: 3 });
scene.add(sun);

function canvasTex(w, h, draw) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const signTex = canvasTex(512, 256, (g, w, h) => {
  g.fillStyle = "#ee6fa8"; g.fillRect(0, 0, w, h);
  g.fillStyle = "rgba(255,255,255,.25)";
  for (let y = 12; y < h; y += 24) for (let x = 12 + (y / 24 % 2) * 12; x < w; x += 24) g.fillRect(x, y, 4, 4);
  g.fillStyle = "#fff"; g.font = "bold 84px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("橋わたし", w / 2, h / 2);
});
const boxTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = "#e3262d"; g.fillRect(0, 0, w, h);
  g.fillStyle = "rgba(255,255,255,.85)";
  for (let y = 16; y < h; y += 40) for (let x = 16 + ((y - 16) / 40 % 2) * 20; x < w; x += 40) {
    g.beginPath(); g.arc(x, y, 6, 0, Math.PI * 2); g.fill();
  }
});
boxTex.wrapS = boxTex.wrapT = THREE.RepeatWrapping;
const netTex = canvasTex(128, 128, (g, w, h) => {
  g.clearRect(0, 0, w, h); g.strokeStyle = "#5a6070"; g.lineWidth = 4;
  for (let i = 0; i <= w; i += 32) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, h); g.stroke(); g.beginPath(); g.moveTo(0, i); g.lineTo(w, i); g.stroke(); }
});
netTex.wrapS = netTex.wrapT = THREE.RepeatWrapping; netTex.repeat.set(5, 3);

const M = {
  wall: new THREE.MeshStandardMaterial({ color: 0xe8ebf0, roughness: 0.85 }),
  shelf: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 }),
  chute: new THREE.MeshStandardMaterial({ color: 0xb9bec8, roughness: 0.9 }),
  sign: new THREE.MeshStandardMaterial({ map: signTex, roughness: 0.7 }),
  bar: new THREE.MeshStandardMaterial({ color: 0xdfe3ea, metalness: 0.85, roughness: 0.22 }),
  post: new THREE.MeshStandardMaterial({ color: 0xaab1bd, metalness: 0.5, roughness: 0.4 }),
  claw: new THREE.MeshStandardMaterial({ color: 0xdcecff, metalness: 0.1, roughness: 0.15, transparent: true, opacity: 0.55 }),
  rubber: new THREE.MeshStandardMaterial({ color: 0xf2a7c3, roughness: 0.7 }),
  frame: new THREE.MeshStandardMaterial({ color: 0xf7f8fa, roughness: 0.6 }),
  acryl: new THREE.MeshStandardMaterial({ color: 0xe8f4ff, roughness: 0.05, transparent: true, opacity: 0.18, depthWrite: false }),
  tip: new THREE.MeshStandardMaterial({ color: 0x3a3f48, roughness: 0.8 }),
  head: new THREE.MeshStandardMaterial({ color: 0xf2f3f5, metalness: 0.2, roughness: 0.35 }),
  label: new THREE.MeshStandardMaterial({ color: 0xd8262c, roughness: 0.5 }),
  shell: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.05, transparent: true, opacity: 0.3, depthWrite: false }),
  net: new THREE.MeshStandardMaterial({ map: netTex, transparent: true, side: THREE.DoubleSide, metalness: 0.5, roughness: 0.5 }),
  box: new THREE.MeshStandardMaterial({ map: boxTex, roughness: 0.55 }),
};

// ---------------------------------------------------------------- 物理
await RAPIER.init();
document.getElementById("load").remove();
const world = new RAPIER.World({ x: 0, y: -9.81, z: 0 });
world.timestep = 1 / 240;
world.integrationParameters.numSolverIterations = 8;
const G_CLAW = 0x0002, G_HEAD = 0x0004;
const groups = (member, filter) => (member << 16) | filter;
const CLAW_GROUPS = groups(G_CLAW, 0xffff & ~G_HEAD);
const HEAD_GROUPS = groups(G_HEAD, 0xffff & ~G_CLAW);
const sync = [];
function q(x, y, z) { const e = new THREE.Quaternion().setFromEuler(new THREE.Euler(x, y, z)); return { x: e.x, y: e.y, z: e.z, w: e.w }; }

// 筐体: 床（取り出し口）・奥の壁・左右（ガラス）
const fixed = world.createRigidBody(RAPIER.RigidBodyDesc.fixed());
function staticBox(hx, hy, hz, x, y, z, mat) {
  world.createCollider(RAPIER.ColliderDesc.cuboid(hx, hy, hz).setTranslation(x, y, z).setFriction(0.6), fixed);
  if (mat) { const m = new THREE.Mesh(new THREE.BoxGeometry(hx * 2, hy * 2, hz * 2), mat); m.position.set(x, y, z); m.receiveShadow = true; scene.add(m); }
}
staticBox(0.42, 0.01, 0.40, 0, -0.01, 0, M.chute);
staticBox(0.40, 0.47, 0.01, 0, 0.46, -0.33, M.wall);
staticBox(0.01, 0.47, 0.40, -0.41, 0.46, 0, null);
staticBox(0.01, 0.47, 0.40, 0.41, 0.46, 0, null);
staticBox(0.40, 0.47, 0.01, 0, 0.46, 0.33, null);
{
  const s = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.21), M.sign); s.position.set(0, 0.62, -0.318); scene.add(s);
  for (const x of [-0.39, 0.39]) {  // 左右の網（見た目だけ）
    const n = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.14), M.net); n.rotation.y = Math.PI / 2; n.position.set(x, BAR_Y + 0.07, 0); scene.add(n); nets.push(n);
  }
  const back = new THREE.Mesh(new THREE.PlaneGeometry(0.84, 0.94), M.wall); back.position.set(0, 0.47, -0.319); back.receiveShadow = true; scene.add(back);
  const side = new THREE.Mesh(new THREE.PlaneGeometry(0.66, 0.94), M.wall); side.rotation.y = -Math.PI / 2; side.position.set(0.415, 0.47, 0); scene.add(side);
  const rod = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.02, 0.02), M.post); rod.position.set(0, 0.89, 0); scene.add(rod);
}

// 台: 支えのバー2本（ゴム巻き）・手前の低いバー・奥の枠・左右の枠。前後に落ちず、2本の間からだけ落ちる
let barParts = [];
function buildBars() {
  for (const [b, meshes] of barParts) { world.removeRigidBody(b); meshes.forEach(m => scene.remove(m)); }
  barParts = []; nearSide.length = 0;
  const r = P.br / 2000, gz = P.gap / 2000 + r;
  const body = world.createRigidBody(RAPIER.RigidBodyDesc.fixed());
  const meshes = [];
  function rodX(rad, y, z, fr, mat) {  // 左右に通す丸い棒
    world.createCollider(RAPIER.ColliderDesc.cylinder(BAR_LEN / 2, rad).setRotation(q(0, 0, Math.PI / 2))
      .setTranslation(0, y, z).setFriction(fr).setRestitution(0.05), body);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad, BAR_LEN, 24), mat);
    m.rotation.z = Math.PI / 2; m.position.set(0, y, z); m.castShadow = true; m.receiveShadow = true; meshes.push(m);
  }
  function block(hx, hy, hz, x, y, z, mat) {
    world.createCollider(RAPIER.ColliderDesc.cuboid(hx, hy, hz).setTranslation(x, y, z).setFriction(0.5), body);
    const m = new THREE.Mesh(new THREE.BoxGeometry(hx * 2, hy * 2, hz * 2), mat);
    m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; meshes.push(m);
    return m;
  }
  for (const sz of [-1, 1]) {
    rodX(r, BAR_Y, sz * gz, P.bfr, M.rubber);
    for (const x of [-BAR_LEN / 2 + 0.012, BAR_LEN / 2 - 0.012]) {   // 留め具
      const c = new THREE.Mesh(new THREE.CylinderGeometry(r * 1.5, r * 1.5, 0.024, 16), M.post);
      c.rotation.z = Math.PI / 2; c.position.set(x, BAR_Y, sz * gz); meshes.push(c);
    }
  }
  const front = gz + P.gfront / 1000, back = -gz - P.gback / 1000;
  rodX(0.010, BAR_Y + 0.005, front, 0.5, M.bar);                     // 手前のバー（倒れた箱がもたれて止まる高さ）
  block(BAR_LEN / 2, 0.035, 0.010, 0, BAR_Y + 0.025, back, M.frame);  // 奥の枠
  block(BAR_LEN / 2, 0.11, 0.004, 0, BAR_Y + 0.17, back, M.acryl);    // その上の透明の板（箱が奥へ越えない）
  for (const sx of [-1, 1]) {                                         // 左右の枠と透明の板
    const zc = (front + back) / 2, hz = (front - back) / 2 + 0.02;
    const f = block(0.012, 0.04, hz, sx * (BAR_LEN / 2 + 0.012), BAR_Y + 0.01, zc, M.frame);
    const a = block(0.004, 0.10, hz, sx * (BAR_LEN / 2 + 0.012), BAR_Y + 0.15, zc, M.acryl);
    if (sx < 0) nearSide.push(f, a);   // よこ から見るとき手前になる
  }
  meshes.forEach(m => scene.add(m));
  barParts.push([body, meshes]);
}

// 箱（奥行きの向きにバーをまたぐ）
let prize = null;
function spawnPrize() {
  if (prize) { world.removeRigidBody(prize.body); scene.remove(prize.mesh); sync.splice(sync.indexOf(prize.pair), 1); }
  const hx = P.bw / 2000, hy = P.bh / 2000, hz = P.bd / 2000, r = P.br / 2000;
  let x = 0, z = 0, yaw = 0;
  if (P.place == 1) { x = (Math.random() - 0.5) * 0.04; z = (Math.random() - 0.5) * 0.02; yaw = (Math.random() - 0.5) * 0.12; }
  if (P.place == 2) { x = (Math.random() - 0.5) * 0.03; yaw = 0.30 + Math.random() * 0.2; }
  const body = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(x, BAR_Y + r + hy + 0.002, z)
    .setRotation(q(0, yaw, 0)).setCcdEnabled(true).setCanSleep(false).setLinearDamping(0.05).setAngularDamping(0.1));
  world.createCollider(RAPIER.ColliderDesc.cuboid(hx, hy, hz).setMass(P.bm / 1000).setFriction(P.bf).setRestitution(0.05), body);
  const geo = new THREE.BoxGeometry(hx * 2, hy * 2, hz * 2);
  const mesh = new THREE.Mesh(geo, M.box); mesh.castShadow = true; mesh.receiveShadow = true; scene.add(mesh);
  const pair = [body, mesh]; sync.push(pair);
  prize = { body, mesh, pair, won: false };
}

// アーム: 頭（位置で動かす・横長のカプセル）＋「く」の字の爪2本（ばね付きの蝶番・z軸まわり）
const head = world.createRigidBody(RAPIER.RigidBodyDesc.kinematicPositionBased().setCanSleep(false).setTranslation(HOME.x, TOP_Y, HOME.z));
const headCol = world.createCollider(RAPIER.ColliderDesc.cuboid(0.12, 0.05, 0.065).setCollisionGroups(HEAD_GROUPS), head);
const headMesh = new THREE.Group();
{
  const sh = new THREE.Shape(), w = 0.11, h = 0.045, rr = 0.04;
  sh.moveTo(-w + rr, -h); sh.lineTo(w - rr, -h); sh.quadraticCurveTo(w, -h, w, -h + rr); sh.lineTo(w, h - rr);
  sh.quadraticCurveTo(w, h, w - rr, h); sh.lineTo(-w + rr, h); sh.quadraticCurveTo(-w, h, -w, h - rr); sh.lineTo(-w, -h + rr);
  sh.quadraticCurveTo(-w, -h, -w + rr, -h);
  const body = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: 0.11, bevelEnabled: true, bevelSize: 0.012, bevelThickness: 0.012 }), M.head);
  body.position.z = -0.055; body.castShadow = true; headMesh.add(body);
  const lab = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.05, 0.002), M.label); lab.position.z = 0.069; headMesh.add(lab);
  const shell = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: 0.13, bevelEnabled: true, bevelSize: 0.02, bevelThickness: 0.02 }), M.shell);
  shell.scale.set(1.06, 1.08, 1); shell.position.z = -0.065; headMesh.add(shell);
}
scene.add(headMesh);
const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.011, 1, 16), M.post); scene.add(rod);
const carriage = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.03, 0.07), M.post); scene.add(carriage);

const claws = [];
for (const s of [-1, 1]) {   // s=-1 左の爪, +1 右の爪
  const hp0 = head.translation();
  const body = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(hp0.x + s * HINGE, hp0.y + HINGE_Y, hp0.z)
    .setCcdEnabled(true).setCanSleep(false).setAngularDamping(2).setLinearDamping(0.5));
  const pts = [[0, 0], [s * (ELBOW[0] - HINGE), ELBOW[1]], [s * (TIP[0] - HINGE), TIP[1]]];
  const g = new THREE.Group(), cols = [];
  for (let i = 0; i < 2; i++) {          // 肘までと、肘から爪先まで
    const [a, b] = [pts[i], pts[i + 1]];
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]), ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    cols.push(world.createCollider(RAPIER.ColliderDesc.cuboid(len / 2, ARM_T / 2, ARM_D / 2).setTranslation(mx, my, 0)
      .setRotation(q(0, 0, ang)).setDensity(1200).setFriction(0.3).setCollisionGroups(CLAW_GROUPS), body));
    for (const z of [-ARM_D / 2, ARM_D / 2]) {   // 板の前と後ろの縁
      const m = new THREE.Mesh(new THREE.BoxGeometry(len + ARM_T, ARM_T, 0.006), M.claw);
      m.position.set(mx, my, z); m.rotation.z = ang; g.add(m);
    }
    const plate = new THREE.Mesh(new THREE.BoxGeometry(len, ARM_T * 0.6, ARM_D), M.claw);
    plate.position.set(mx, my, 0); plate.rotation.z = ang; plate.castShadow = true; g.add(plate);
  }
  const tp = [pts[2][0] - s * 0.006, pts[2][1]];   // 黒いゴムの爪先（内向きに反る）
  cols.push(world.createCollider(RAPIER.ColliderDesc.cuboid(0.013, 0.006, ARM_D * 0.35).setTranslation(tp[0], tp[1], 0)
    .setRotation(q(0, 0, s * TIP_SLOPE)).setDensity(1200).setFriction(0.5).setCollisionGroups(CLAW_GROUPS), body));
  const tip = new THREE.Mesh(new THREE.BoxGeometry(0.026, 0.012, ARM_D * 0.7), M.tip);
  tip.position.set(tp[0], tp[1], 0); tip.rotation.z = s * TIP_SLOPE; tip.castShadow = true; g.add(tip);
  const jd = RAPIER.JointData.revolute({ x: s * HINGE, y: HINGE_Y, z: 0 }, { x: 0, y: 0, z: 0 }, { x: 0, y: 0, z: 1 });
  jd.limitsEnabled = true;
  jd.limits = s < 0 ? [-0.9, 0.4] : [-0.4, 0.9];
  const joint = world.createImpulseJoint(jd, head, body, true);
  joint.setContactsEnabled(false);
  joint.configureMotorModel(RAPIER.MotorModel.ForceBased);
  scene.add(g); sync.push([body, g]);
  claws.push({ s, body, joint, colliders: cols });
}
// 角度: 左の爪は ＋θ で閉じる（下が右へ寄る）、右の爪は −θ で閉じる
let clawTarget = "open", gripScale = 1;
function driveClaws() {
  const open = clawTarget === "open";
  const k = 1.2 * P.grip * gripScale, d = 0.04 + 0.04 * P.grip;
  for (const c of claws) {
    const target = open ? c.s * (P.open * Math.PI / 180) : -c.s * 0.25;   // 爪先が真ん中を越える先を狙って押し続ける
    c.joint.configureMotorPosition(target, open ? 3 : k, open ? 0.2 : d);
  }
}
function clawTouching() {   // 爪か頭が何かに触れたか（本物は景品に触れるとワイヤーが緩んで止まる）
  let hit = false;
  for (const col of [headCol, ...claws.flatMap(c => c.colliders)]) {
    world.contactPairsWith(col, other => { if (!hit) world.contactPair(col, other, m => { if (m.numContacts() > 0) hit = true; }); });
  }
  return hit;
}

// ---------------------------------------------------------------- 遊びの流れ
const bl = document.getElementById("bl"), br = document.getElementById("br"), bc = document.getElementById("bc");
let state = "idle", dir = 0, t0 = 0, pushLeft = -1;
const hp = { x: HOME.x, y: TOP_Y, z: HOME.z };
function ui() {
  document.getElementById("left").textContent = credits;
  document.getElementById("got").textContent = got;
  const can = state === "idle" && credits > 0;
  bl.disabled = br.disabled = bc.disabled = !can;
}
function move(d) { if (state === "idle" && credits > 0) dir = d; else dir = 0; bl.classList.toggle("on", dir < 0); br.classList.toggle("on", dir > 0); }
function startCatch() {
  if (state !== "idle" || credits <= 0) return;
  credits--; persist(); dir = 0; move(0);
  state = "down"; pushLeft = -1; clawTarget = "open"; driveClaws(); ui();
}
for (const [el, d] of [[bl, -1], [br, 1]]) {
  el.addEventListener("pointerdown", e => { e.preventDefault(); el.setPointerCapture(e.pointerId); move(d); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) el.addEventListener(ev, () => move(0));
}
bc.addEventListener("pointerdown", e => { e.preventDefault(); bc.classList.add("on"); startCatch(); });
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) bc.addEventListener(ev, () => bc.classList.remove("on"));
addEventListener("keydown", e => {
  if (e.repeat) return;
  if (e.key === "ArrowLeft") move(-1); if (e.key === "ArrowRight") move(1);
  if (e.key === " " || e.key === "Enter") startCatch();
  if (e.key === "c") setView((viewIdx + 1) % VIEWS.length);
});
addEventListener("keyup", e => { if (e.key === "ArrowLeft" || e.key === "ArrowRight") move(0); });

let simTime = 0;
function step(dt) {
  if (state === "idle" && dir) {
    const v = VIEWS[viewIdx], a = v.axis;
    hp[a] = Math.max(LIM[a][0], Math.min(LIM[a][1], hp[a] + dir * v.sign * P.speed * dt));
  }
  switch (state) {
    case "down": {
      if (pushLeft < 0 && clawTouching()) pushLeft = P.push / 1000;
      const dy = DOWN_V * dt;
      hp.y -= dy;
      if (pushLeft >= 0) pushLeft -= dy;
      if (hp.y <= 0.04 + REACH || (pushLeft !== -1 && pushLeft <= 0)) { state = "close"; t0 = simTime; clawTarget = "close"; gripScale = 1; driveClaws(); }
      break;
    }
    case "close": if (simTime - t0 > 0.8) { state = "up"; t0 = simTime; } break;
    case "up": {
      hp.y = Math.min(TOP_Y, hp.y + UP_V * dt);
      gripScale = 1 + (P.topkeep - 1) * Math.min(1, (simTime - t0) / 1.2); driveClaws();
      if (hp.y >= TOP_Y) state = "back";
      break;
    }
    case "back": {
      const dx = HOME.x - hp.x, dz = HOME.z - hp.z, d = Math.hypot(dx, dz), s = BACK_V * dt;
      if (d <= s) { hp.x = HOME.x; hp.z = HOME.z; state = "release"; t0 = simTime; clawTarget = "open"; gripScale = 1; driveClaws(); }
      else { hp.x += dx / d * s; hp.z += dz / d * s; }
      break;
    }
    case "release": if (simTime - t0 > 0.8) { state = "idle"; ui(); } break;
  }
  head.setNextKinematicTranslation(hp);
  world.step();
  simTime += dt;
  // 獲得: 下まで落ちた（2本の間から、または運んで取り出し口へ）。手前のバーにもたれただけでは数えない
  const bp = prize && prize.body.translation();
  if (prize && !prize.won && bp.y < BAR_Y - 0.12) {
    prize.won = true; got++; persist(); ui();
    const m = document.getElementById("msg"); m.classList.add("show");
    setTimeout(() => m.classList.remove("show"), 1400);
    setTimeout(() => { if (prize.won) spawnPrize(); }, 2200);
  }
}

// ---------------------------------------------------------------- 設定の画面
const sheet = document.getElementById("sheet");
for (const k of Object.keys(DEF)) {
  const el = document.getElementById("p_" + k); if (!el) continue;
  const out = el.parentElement.querySelector("output");
  el.value = P[k]; out.textContent = FMT[k](P[k]);
  el.addEventListener("input", () => { P[k] = +el.value; out.textContent = FMT[k](P[k]); persist(); if (["grip", "open"].includes(k)) driveClaws(); });
}
function resetTable() { buildBars(); spawnPrize(); setView(viewIdx); }
document.getElementById("home").onclick = () => resetTable();
document.getElementById("gear").onclick = () => sheet.classList.toggle("open");
document.getElementById("close").onclick = () => sheet.classList.remove("open");
document.getElementById("reset").onclick = () => { resetTable(); sheet.classList.remove("open"); };
document.getElementById("plus").onclick = () => { credits += 10; persist(); ui(); };
document.getElementById("defaults").onclick = () => {
  Object.assign(P, DEF); persist();
  for (const k of Object.keys(DEF)) { const el = document.getElementById("p_" + k); if (el) { el.value = P[k]; el.parentElement.querySelector("output").textContent = FMT[k](P[k]); } }
  driveClaws();
};
document.getElementById("cam").onclick = () => setView((viewIdx + 1) % VIEWS.length);

// ---------------------------------------------------------------- 回す
resetTable(); driveClaws(); resize(); setView(0); ui();
const tmpQ = new THREE.Quaternion();
let last = performance.now(), acc = 0, paused = false;
function frame(now) {
  acc += Math.min(0.05, (now - last) / 1000); last = now;
  if (paused) acc = 0;
  while (acc >= world.timestep) { step(world.timestep); acc -= world.timestep; }
  for (const [b, m] of sync) { const p = b.translation(), r = b.rotation(); m.position.set(p.x, p.y, p.z); m.quaternion.copy(tmpQ.set(r.x, r.y, r.z, r.w)); }
  headMesh.position.set(hp.x, hp.y, hp.z);
  carriage.position.set(hp.x, 0.88, hp.z);
  const len = 0.88 - hp.y; rod.scale.y = Math.max(0.001, len); rod.position.set(hp.x, hp.y + len / 2, hp.z);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// 試験用の取っ手（画面には出ない）
window.__crane = { get state() { return state; }, P, get prize() { return prize && prize.body.translation(); },
  get prizeRot() { return prize && prize.body.rotation(); },
  get claws() { return claws.map(c => { const r = c.body.rotation(); return +(2 * Math.atan2(r.z, r.w)).toFixed(3); }); },
  get head() { return { ...hp }; }, get got() { return got; }, view: setView, reset: resetTable,
  pause(v) { paused = v; },
  sim(sec) { const n = Math.round(sec / world.timestep); for (let i = 0; i < n; i++) step(world.timestep); },
  go(x, z) { hp.x = x; hp.z = z; },
  catch: startCatch,
  until(st, max = 30) { const n = Math.round(max / world.timestep); for (let i = 0; i < n && state !== st; i++) step(world.timestep); return state; } };

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
